schema_version = "1.3"

[task]
name = "oshorunke1/economy-ledger-audit"
description = "Rebuild final coin balances from a messy game economy event log per a written policy and flag exploit accounts."
authors = [{ name = "Olushola Shorunke" }]
keywords = ["game-backend", "economy", "idempotency", "event-sourcing", "data-cleaning", "python"]

[metadata]
difficulty = "hard"
category = "software-engineering"
tags = ["game-backend", "economy", "idempotency", "event-log", "exploit-detection"]

[verifier]
timeout_sec = 600.0

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
# "no-network" needs nftables fib_inet support, which Docker Desktop on WSL2 lacks,
# so this stays public. The answer generator only lands in /tests at grading time.
network_mode = "public"
