schema_version = "1.3"

[task]
name = "oshorunke1/lockstep-desync"
description = "Remove every source of nondeterminism from a lockstep RTS sim so peers fed the same inputs always agree on the state hash, without changing the documented gameplay."
keywords = ["gamedev", "lockstep", "determinism", "networking", "debugging", "python"]

[[task.authors]]
name = "Olushola Shorunke"

[metadata]
